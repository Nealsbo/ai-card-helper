[project]
name = "instrument-copy-assistant"
version = "0.1.0"
description = "Локальный AI-помощник для подготовки карточек измерительных приборов"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.25,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

